name: Mutation testing

# Reruns the engine suite against ~1,500 deliberate bugs. About an hour, so it runs nightly
# and on demand rather than on every push. Fails below the threshold in stryker.config.json.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: packages/engine/reports/mutation/
